services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    network_mode: "host"
    volumes:
      - .:/app
      # Keep the image's Linux dependencies from being hidden by the source bind mount.
      - /app/.venv
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - ENV=production
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - TZ=Asia/Kolkata
    restart: on-failure:3
