<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-slate-950 px-4 text-slate-100">
    <main class="w-full max-w-sm rounded-xl border border-slate-800 bg-slate-900 p-7 shadow-2xl">
      <h1 class="text-xl font-semibold">Trading Dashboard</h1>
      <p class="mt-1 text-sm text-slate-400">Sign in to continue.</p>
      {% if error %}
      <p class="mt-4 rounded bg-rose-950 px-3 py-2 text-sm text-rose-200">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login" class="mt-6 space-y-4">
        <label class="block text-sm">Username
          <input name="username" autocomplete="username" required class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-emerald-500" />
        </label>
        <label class="block text-sm">Password
          <input type="password" name="password" autocomplete="current-password" required class="mt-1 w-full rounded border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-emerald-500" />
        </label>
        <button class="w-full rounded bg-emerald-600 px-3 py-2 font-medium hover:bg-emerald-500">Sign in</button>
      </form>
    </main>
  </body>
</html>
