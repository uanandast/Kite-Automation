    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyotp>=2.9",
    "selenium>=4.18",
    "webdriver-manager>=4.0.1",
    "google-genai>=0.3.0",
    "python-dotenv",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
]
