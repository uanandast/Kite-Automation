[project]
name = "kite-fast-api"
version = "0.1.0"
description = "FastAPI migration for Kite App"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "kiteconnect>=5.0.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyotp>=2.9",
    "selenium>=4.18",
    "webdriver-manager>=4.0.1",
    "python-dotenv",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "google-genai",
    "ruff>=0.16.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"

[tool.ruff.lint]
# These legacy modules are imported by the existing application using their
# historical names, and the browser/login flows intentionally use broad
# exception fallbacks to keep automation running.
ignore = ["BLE001", "N999"]
